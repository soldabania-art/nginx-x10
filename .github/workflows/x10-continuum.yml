name: X10 Continuum research checks

on:
  push:
    branches: [x10-development, x10-main]
    paths: ['x10/continuum/**', '!x10/continuum/BACKGROUND.json', '!x10/continuum/*.md', '.github/workflows/x10-continuum.yml']
  pull_request:
    branches: [master, x10-development, x10-main]
    paths: ['x10/continuum/**', '!x10/continuum/BACKGROUND.json', '!x10/continuum/*.md', '.github/workflows/x10-continuum.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x10-continuum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Independent record and state counterexamples
        run: node x10/continuum/check.mjs
      - name: Same TCP connection across research worker versions
        run: node --test --test-reporter=tap x10/continuum/process-handover.test.mjs
