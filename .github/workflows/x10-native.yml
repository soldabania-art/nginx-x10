name: X10 native compatibility

on:
  push:
    branches: [x10-continuum-development, x10-development, x10-main]
  pull_request:
    branches: [master, x10-continuum-development, x10-development, x10-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x10-native-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.changed.outputs.native }}
      research: ${{ steps.changed.outputs.research }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check scope fail-closed controls
        run: node --test .github/scripts/x10-change-scope.test.mjs
      - name: Classify exact event delta
        id: changed
        run: node .github/scripts/x10-change-scope.mjs

  linux:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.native != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Validate release-record contract and refusal controls
        run: |
          mkdir -p x10/.build/ci-evidence
          node --test --test-reporter=tap \
            x10/release/check-release-record.test.mjs \
            x10/release/release-record-heldout.test.mjs \
            > x10/.build/ci-evidence/release-record.tap
      - name: Validate alpha archive refusal controls
        run: node --test --test-reporter=tap x10/release/verify-alpha-archive.test.mjs > x10/.build/ci-evidence/alpha-archive.tap
      - name: Validate guarded user-service recipe
        run: node --test --test-reporter=tap x10/service/user-unit.test.mjs > x10/.build/ci-evidence/user-unit.tap
      - name: Validate fail-closed user-manager preflight
        run: node --test --test-reporter=tap x10/service/preflight.test.mjs > x10/.build/ci-evidence/service-preflight.tap
      - name: Validate actual-service harness refusal controls
        run: node --test --test-reporter=tap x10/service/lifecycle-check.test.mjs > x10/.build/ci-evidence/service-lifecycle-contract.tap
      - name: Validate bounded owned-service journal observations
        run: node --test --test-reporter=tap x10/service/journal-check.test.mjs > x10/.build/ci-evidence/service-journal-contract.tap
      - name: Validate bounded downstream HTTPS fixture controls
        run: node --test --test-reporter=tap x10/service/tls-fixture.test.mjs > x10/.build/ci-evidence/service-https-contract.tap
      - name: Validate bounded verified HTTPS origin fixture controls
        run: node --test --test-reporter=tap x10/service/origin-fixture.test.mjs > x10/.build/ci-evidence/service-origin-contract.tap
      - name: Validate bounded paused TLS client controls
        run: node --test --test-reporter=tap x10/service/slow-client.test.mjs > x10/.build/ci-evidence/service-slow-client-contract.tap
      - name: Validate owned operator interruption controls
        run: node --test --test-reporter=tap x10/service/interrupted-operator.test.mjs > x10/.build/ci-evidence/service-interrupted-operator-contract.tap
      - name: Validate failed interruption containment controls
        run: node --test --test-reporter=tap x10/service/interruption-failure.test.mjs > x10/.build/ci-evidence/service-interruption-failure-contract.tap
      - name: Validate authenticated Node dependency refusal controls
        run: node --test --test-reporter=tap x10/service/verified-node.test.mjs > x10/.build/ci-evidence/verified-node-contract.tap
      - name: Validate managed operator-package return refusal controls
        run: |
          node --test --test-reporter=tap \
            x10/service/operator-package-return-proof.test.mjs \
            x10/service/operator-package-return.test.mjs \
            x10/service/legacy-cli-peers.test.mjs \
            > x10/.build/ci-evidence/service-package-return-contract.tap
      - name: Validate managed unhealthy-package fallback refusal controls
        run: |
          node --test --test-reporter=tap \
            x10/service/operator-package-fallback-proof.test.mjs \
            x10/service/operator-package-fallback.test.mjs \
            > x10/.build/ci-evidence/service-package-fallback-contract.tap
      - name: Build dependencies and optional test clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 python3-venv git libpcre2-dev libssl-dev zlib1g-dev \
            libcrypt-dev libfcgi-perl libscgi-perl libio-socket-ssl-perl
      - name: Install pinned HTTP3 interoperability client
        run: |
          python3 -m venv x10/.build/http3-venv
          x10/.build/http3-venv/bin/python -m pip install --require-hashes --only-binary=:all: \
            -r x10/test/http3-baseline.requirements.txt
      - name: Install independent HTTP3 HEAD client
        run: |
          python3 -m venv x10/.build/http3-head-venv
          x10/.build/http3-head-venv/bin/python -m pip install --require-hashes --only-binary=:all: \
            -r x10/test/http3-head.requirements.txt
      - name: Compile native profile
        run: |
          bash x10/build.sh --jobs 2
          mkdir -p x10/.build/ci-evidence
          cp x10/.build/manifest.json x10/.build/ci-evidence/build.json
      - name: Native regressions and pinned official compatibility sample
        run: node x10/test/all.mjs --official > x10/.build/ci-evidence/checks.json
      - name: Verify installed HTTPS upstream trust and hostname
        run: node --test --test-reporter=tap x10/test/alpha-tls.test.mjs > x10/.build/ci-evidence/alpha-tls.tap
      - name: Verify managed frontend HTTPS and certificate lifecycle
        run: node --test --test-reporter=tap x10/test/frontend-tls.test.mjs > x10/.build/ci-evidence/frontend-tls.tap
      - name: Verify native tenant cache contract experiment
        run: node --test --test-reporter=tap x10/test/proof.test.mjs > x10/.build/ci-evidence/guard-kernel.tap
      - name: Verify private Unix control transport
        run: |
          node x10/test/control-api-baseline.mjs --transport unix > x10/.build/ci-evidence/control-api-unix.json
          node x10/test/generations.mjs --transport unix > x10/.build/ci-evidence/generations-unix.json
          X10_STATUS_TRANSPORT=unix node --test --test-reporter=tap x10/test/operator-status.test.mjs > x10/.build/ci-evidence/operator-status-unix.tap
      - name: Build profile without control API
        run: bash x10/test/control-disabled.sh --output x10/.build/ci-evidence/control-disabled.json
      - name: Package local Linux alpha
        run: node x10/alpha/cli.mjs pack --output x10/.build/dist/nginx-x10-linux-alpha.tar.gz > x10/.build/ci-evidence/alpha-package.json
      - name: Checksum local Linux alpha
        working-directory: x10/.build/dist
        run: sha256sum nginx-x10-linux-alpha.tar.gz > nginx-x10-linux-alpha.tar.gz.sha256
      - name: Verify packed alpha before extraction
        run: |
          checksum=$(sha256sum x10/.build/dist/nginx-x10-linux-alpha.tar.gz)
          node x10/release/verify-alpha-archive.mjs \
            --archive x10/.build/dist/nginx-x10-linux-alpha.tar.gz \
            --sha256 "${checksum%% *}" > x10/.build/ci-evidence/alpha-archive.json
      - name: Verify temporary user-service with authenticated private Node
        run: |
          node --input-type=module <<'NODE'
          import { constants } from 'node:fs';
          import { mkdtemp, chmod, writeFile, readFile, readdir, unlink, rmdir, mkdir, lstat, open, realpath } from 'node:fs/promises';
          import { spawn, execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          import { pathToFileURL } from 'node:url';
          import { createHash } from 'node:crypto';
          import path from 'node:path';
          import os from 'node:os';
          const evidence = 'x10/.build/ci-evidence';
          let root, prefix, archive, envelope, history, historicalCli;
          const source = 'x10/service/lifecycle-check.mjs';
          const sourceSha = 'e88ef9604b1d955ca3235b04faf4e0cb37266bfef3255e68e27d75dc63ce1370';
          const managedSource = 'x10/service/operator-package-return.mjs';
          const managedSourceSha = '612f9f882084d10bc9c921639fea3fca63520736b223b7761cc725d3aaa3a0d7';
          const managedProofSource = 'x10/service/operator-package-return-proof.mjs';
          const managedProofSha = 'baf6b3dc08ecf79311e95c57a8e16042c93f0f6852e173149bf78df67a2a87de';
          const fallbackSource = 'x10/service/operator-package-fallback.mjs';
          const fallbackSourceSha = 'a4cccc20636a1f4f5bf29eb0977d979fcf0da1f931b94d35eae80407094e26e3';
          const fallbackProofSource = 'x10/service/operator-package-fallback-proof.mjs';
          const fallbackProofSha = '6f9291b947f4d5d70d9ccfc79944820e1ef45253cb87388a1d508d5b7bcc2ecb';
          const historicalCommit = 'acb648392e745b5246a5620f2ea6a6286dc06d42';
          const historicalBlob = 'f036791f3e843c3628964f5c61b0bc0ab903d6f9';
          const historicalSha = '4560b8b2503f109f210599a6277bdf5497118e3220c1d2fb6a0c041283c3810d';
          const hash = b => createHash('sha256').update(b).digest('hex');
          const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
          const save = (name, report) => writeFile(evidence + '/' + name + '.json', JSON.stringify(report) + '\n');
          const execute = promisify(execFile);
          const status = { ok: false, stage: 'download', code: 'bootstrap_failed', runtimeRemoved: false,
            temporaryRootRemoved: false, serviceAccepted: false, productionAccepted: false,
            subprocessOutputsPublished: false, historicalCliVerified: false, managedPackageReturnExecuted: false,
            managedPackageFallbackAttempted: false, managedPackageFallbackExecuted: false };
          const stamp = s => ({ dev: s.dev, ino: s.ino, uid: s.uid, mode: s.mode, nlink: s.nlink,
            size: s.size, mtimeMs: s.mtimeMs, ctimeMs: s.ctimeMs });
          async function directory(file) {
            if (await realpath(file) !== file) throw new Error('bootstrap_directory_changed');
            const s = await lstat(file);
            if (!s.isDirectory() || s.uid !== process.getuid() || (s.mode & 0o7777) !== 0o700)
              throw new Error('bootstrap_directory_changed');
            return { dev: s.dev, ino: s.ino, uid: s.uid, mode: s.mode };
          }
          async function snapshot(file, max, mode) {
            if (await realpath(file) !== file) throw new Error('bootstrap_file_changed');
            const selected = await lstat(file);
            if (!selected.isFile() || selected.uid !== process.getuid() || selected.nlink !== 1
                || (selected.mode & 0o7777) !== mode || selected.size < 1 || selected.size > max)
              throw new Error('bootstrap_file_changed');
            const handle = await open(file, constants.O_RDONLY | constants.O_NOFOLLOW | constants.O_NONBLOCK);
            try {
              const s = await handle.stat();
              if (!s.isFile() || s.uid !== process.getuid() || s.nlink !== 1 || (s.mode & 0o7777) !== mode
                  || s.size < 1 || s.size > max || !same(stamp(selected), stamp(s))) throw new Error('bootstrap_file_changed');
              const bytes = Buffer.alloc(s.size + 1); let count = 0;
              while (count < bytes.length) { const r = await handle.read(bytes, count, bytes.length - count, null); if (!r.bytesRead) break; count += r.bytesRead; }
              if (count !== s.size || !same(stamp(s), stamp(await handle.stat()))
                  || !same(stamp(s), stamp(await lstat(file)))) throw new Error('bootstrap_file_changed');
              return { identity: stamp(s), sha256: hash(bytes.subarray(0, count)) };
            } finally { await handle.close(); }
          }
          async function recheck(file, expected, max, mode) {
            if (!same(await snapshot(file, max, mode), expected)) throw new Error('bootstrap_file_changed');
          }
          async function checkerPins() {
            if (hash(await readFile(source)) !== sourceSha || hash(await readFile(managedSource)) !== managedSourceSha
                || hash(await readFile(managedProofSource)) !== managedProofSha
                || hash(await readFile(fallbackSource)) !== fallbackSourceSha
                || hash(await readFile(fallbackProofSource)) !== fallbackProofSha) throw new Error('checker_source_changed');
          }
          async function historicalBytes() {
            // Git is used only by this original checkout-owned Node, before the
            // authenticated private Node runs. No safe.directory/config changes.
            const object = historicalCommit + ':x10/alpha/cli.mjs';
            const options = { cwd: process.cwd(), encoding: 'buffer', timeout: 5000, maxBuffer: 256 * 1024 };
            const identity = await execute('/usr/bin/git', ['rev-parse', object], options);
            if (!identity.stdout.equals(Buffer.from(historicalBlob + '\n')) || identity.stderr.length) throw new Error('historical_cli_refused');
            const raw = await execute('/usr/bin/git', ['show', object], options);
            if (raw.stderr.length || raw.stdout.length !== 68551 || hash(raw.stdout) !== historicalSha) throw new Error('historical_cli_refused');
            // This is a legacy-CLI/current-peer fixture, not the full acb package.
            // Import only after the literal checker source pin has been checked.
            await checkerPins();
            const { SHARED_OPERATOR_PEERS, assessSharedPeerBytes } = await import(pathToFileURL(path.resolve(managedSource)).href);
            if (SHARED_OPERATOR_PEERS.profile !== 'LEGACY_CLI_WITH_REVIEWED_CURRENT_PEERS'
                || SHARED_OPERATOR_PEERS.commit !== '98bc32d4ee9a6c1d6ed198135df01065ad1a65e7'
                || SHARED_OPERATOR_PEERS.files.length !== 8) throw new Error('shared_operator_peers_refused');
            const peers = SHARED_OPERATOR_PEERS.files.map(row => row.path);
            const unchanged = await execute('/usr/bin/git', ['diff', '--exit-code', SHARED_OPERATOR_PEERS.commit, '--', ...peers], options);
            if (unchanged.stdout.length || unchanged.stderr.length) throw new Error('historical_runtime_peers_changed');
            for (const row of SHARED_OPERATOR_PEERS.files) {
              const identity = await execute('/usr/bin/git', ['rev-parse', SHARED_OPERATOR_PEERS.commit + ':' + row.path], options);
              if (!identity.stdout.equals(Buffer.from(row.blob + '\n')) || identity.stderr.length
                  || !assessSharedPeerBytes(row.path, await readFile(row.path)).valid) throw new Error('shared_operator_peers_refused');
            }
            return raw.stdout;
          }
          async function run(exe, args, timeout, maxOutput = 1024 * 1024) {
            return new Promise(resolve => {
              let child, bytes = 0, stderrBytes = 0, timedOut = false, fault = false, forced = false;
              const output = []; let grace;
              try { child = spawn(exe, args, { stdio: ['ignore', 'pipe', 'pipe'] }); }
              catch { resolve({ code: null, output: '', stderrBytes: 0, failed: true }); return; }
              const stop = () => { if (timedOut) return; timedOut = true; child.kill('SIGTERM');
                grace = setTimeout(() => { forced = true; child.kill('SIGKILL'); }, 15000); };
              const timer = setTimeout(stop, timeout);
              child.once('error', () => { fault = true; });
              child.stdout.on('data', b => { bytes += b.length;
                if (bytes > maxOutput) { fault = true; stop(); } else output.push(b); });
              child.stderr.on('data', b => { bytes += b.length; stderrBytes += b.length; if (bytes > maxOutput) { fault = true; stop(); } });
              child.once('close', (code, signal) => { clearTimeout(timer); clearTimeout(grace);
                resolve({ code, output: Buffer.concat(output).toString('utf8'), stderrBytes,
                  failed: fault || timedOut || forced || Boolean(signal) }); });
            });
          }
          async function jsonStep(name, exe, args, timeout, maxOutput = 1024 * 1024, validate = null, validateFailure = null) {
            const result = await run(exe, args, timeout, maxOutput);
            let report;
            try { report = JSON.parse(result.output); } catch { report = { ok: false, code: 'bootstrap_child_report_invalid' }; }
            const managed = ['service-package-return', 'service-package-fallback'].includes(name);
            let validated = validate === null && !managed;
            try { if (validate) validated = validate(report)?.ok === true; } catch {}
            if (result.failed || result.code !== 0 || report?.ok !== true
                || (managed && result.stderrBytes !== 0) || !validated) {
              // Only a source-pinned closed failure schema may retain finite
              // adverse phase/reason/cleanup facts. It never admits success.
              let safeFailure = false;
              try { if (validateFailure) safeFailure = validateFailure(report)?.validFailureReport === true; } catch {}
              await save(name, managed ? safeFailure ? report
                : { ok: false, code: name === 'service-package-fallback'
                  ? 'managed_package_fallback_failed' : 'managed_package_return_failed', subprocessOutputsPublished: false }
                : report && typeof report === 'object' ? report : { ok: false, code: 'bootstrap_child_report_invalid' });
              throw new Error('bootstrap_stage_failed');
            }
            await save(name, report); return report;
          }
          try {
            await save('service-package-return', { ok: false, code: 'managed_package_return_not_executed', subprocessOutputsPublished: false });
            await save('service-package-fallback', { ok: false, code: 'managed_package_fallback_not_executed', subprocessOutputsPublished: false });
            status.stage = 'historical_preflight';
            await checkerPins();
            const oldCliBytes = await historicalBytes();
            root = await mkdtemp(path.join(os.tmpdir(), 'x10-node-bootstrap-'));
            await chmod(root, 0o700); const rootIdentity = await directory(root);
            prefix = root + '/runtime'; archive = root + '/node.tar.xz';
            envelope = root + '/service-evidence.json'; history = root + '/history'; historicalCli = history + '/old-cli.mjs';
            await mkdir(history, { mode: 0o700 }); const historyIdentity = await directory(history);
            const oldHandle = await open(historicalCli, constants.O_WRONLY | constants.O_CREAT | constants.O_EXCL | constants.O_NOFOLLOW, 0o400);
            try { await oldHandle.writeFile(oldCliBytes); await oldHandle.sync(); } finally { await oldHandle.close(); }
            const historicalSnapshot = await snapshot(historicalCli, 68551, 0o400);
            if (historicalSnapshot.identity.size !== 68551 || historicalSnapshot.sha256 !== historicalSha) throw new Error('historical_cli_refused');
            status.historicalCliVerified = true;
            const download = await run('/usr/bin/curl', ['--fail', '--silent', '--show-error',
              '--proto', '=https', '--tlsv1.2', '--connect-timeout', '10', '--max-time', '60',
              '--max-filesize', '67108864', '--retry', '2', '--retry-max-time', '120',
              '--output', archive,
              'https://nodejs.org/download/release/v22.23.3/node-v22.23.3-linux-x64.tar.xz'], 150000);
            if (download.failed || download.code !== 0) throw new Error('download_failed');
            await chmod(archive, 0o600); const archiveSnapshot = await snapshot(archive, 67108864, 0o600);
            status.stage = 'authenticated_install';
            const installed = await jsonStep('verified-node', process.execPath,
              ['x10/service/verified-node.mjs', '--archive', archive, '--prefix', prefix], 120000);
            await checkerPins(); await recheck(historicalCli, historicalSnapshot, 68551, 0o400);
            status.stage = 'actual_service';
            const alpha = 'x10/.build/dist/nginx-x10-linux-alpha.tar.gz', alphaSha = hash(await readFile(alpha));
            const report = await jsonStep('service-lifecycle', prefix + '/bin/node',
              [source, '--archive', alpha, '--sha256', alphaSha], 240000);
            await checkerPins(); await recheck(historicalCli, historicalSnapshot, 68551, 0o400);
            status.stage = 'actual_managed_package_return';
            const { checkManagedOperatorReturnReport, checkManagedOperatorReturnFailureReport } = await import(pathToFileURL(path.resolve(managedProofSource)).href);
            if (typeof checkManagedOperatorReturnReport !== 'function' || typeof checkManagedOperatorReturnFailureReport !== 'function')
              throw new Error('managed_checker_api_changed');
            const managedPackageReport = await jsonStep('service-package-return', prefix + '/bin/node',
              [managedSource, '--archive', path.resolve(alpha), '--sha256', alphaSha, '--historical-cli', historicalCli], 240000, 12288, checkManagedOperatorReturnReport, checkManagedOperatorReturnFailureReport);
            status.managedPackageReturnExecuted = true;
            await checkerPins(); await recheck(historicalCli, historicalSnapshot, 68551, 0o400);
            status.stage = 'actual_managed_package_fallback';
            const { checkManagedOperatorFallbackReport, checkManagedOperatorFallbackFailureReport } = await import(pathToFileURL(path.resolve(fallbackProofSource)).href);
            if (typeof checkManagedOperatorFallbackReport !== 'function' || typeof checkManagedOperatorFallbackFailureReport !== 'function')
              throw new Error('fallback_checker_api_changed');
            status.managedPackageFallbackAttempted = true;
            const fallbackPackageReport = await jsonStep('service-package-fallback', prefix + '/bin/node',
              [fallbackSource, '--archive', path.resolve(alpha), '--sha256', alphaSha, '--historical-cli', historicalCli], 240000, 12288, checkManagedOperatorFallbackReport, checkManagedOperatorFallbackFailureReport);
            status.managedPackageFallbackExecuted = true;
            await checkerPins(); await recheck(historicalCli, historicalSnapshot, 68551, 0o400);
            // All three exact source-pinned children must have closed normally
            // with code zero. Same-UID coordination is not OS fencing.
            const envelopeBytes = Buffer.from(JSON.stringify({ checkerExited: true, checkerExitCode: 0,
              runtimeInstallationId: installed.installationId, runtimeNodeSha256: installed.nodeSha256,
              sourceLifecycleSha256: sourceSha, report, managedPackageCheckerExited: true,
              managedPackageCheckerExitCode: 0, sourceManagedPackageSha256: managedSourceSha,
              sourceManagedPackageProofSha256: managedProofSha, managedPackageReport,
              fallbackPackageCheckerExited: true, fallbackPackageCheckerExitCode: 0,
              sourceFallbackPackageSha256: fallbackSourceSha, sourceFallbackPackageProofSha256: fallbackProofSha,
              fallbackPackageReport }) + '\n');
            if (envelopeBytes.length > 32768) throw new Error('cleanup_envelope_limit');
            await writeFile(envelope, envelopeBytes, { mode: 0o600, flag: 'wx' });
            const envelopeSnapshot = await snapshot(envelope, 32768, 0o600);
            status.stage = 'dependency_cleanup';
            const cleanup = await jsonStep('verified-node-cleanup', process.execPath,
              ['x10/service/verified-node.mjs', '--cleanup', '--prefix', prefix, '--service-evidence', envelope], 30000);
            if (cleanup.runtimeRemoved !== true) throw new Error('runtime_retained');
            status.runtimeRemoved = true;
            if (!same(await directory(root), rootIdentity) || !same(await directory(history), historyIdentity)
                || !same((await readdir(root)).sort(), ['history', 'node.tar.xz', 'service-evidence.json'])
                || !same(await readdir(history), ['old-cli.mjs'])) throw new Error('cleanup_inventory_unknown');
            await recheck(historicalCli, historicalSnapshot, 68551, 0o400);
            await recheck(archive, archiveSnapshot, 67108864, 0o600);
            await recheck(envelope, envelopeSnapshot, 32768, 0o600);
            await unlink(historicalCli); await rmdir(history); await unlink(archive); await unlink(envelope); await rmdir(root);
            status.temporaryRootRemoved = true; status.ok = true; status.stage = 'complete';
            status.code = 'authenticated_dependency_lifecycle_complete';
          } catch {
            // Preserve the runtime whenever any service cleanup is unconfirmed:
            // a generated unit's ExecStop may still require this exact Node.
            status.code = 'bootstrap_stage_failed'; process.exitCode = 1;
          }
          try { await save('verified-node-bootstrap', status); }
          catch { process.stdout.write('{"ok":false,"code":"bootstrap_evidence_write_failed"}\n'); process.exitCode = 1; }
          NODE
      - name: Preserve JSON evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: x10-native-evidence
          path: |
            x10/.build/ci-evidence/*.json
            x10/.build/ci-evidence/*.tap
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve local Linux alpha
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nginx-x10-linux-alpha
          path: x10/.build/dist/nginx-x10-linux-alpha.tar.gz*
          if-no-files-found: error
          retention-days: 14
